name: Build Signed Android Release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signed-build
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate files
        run: |
          test -f www/index.html
          grep -q viewport www/index.html
          node -e "JSON.parse(require('fs').readFileSync('package.json'))"
          node -e "JSON.parse(require('fs').readFileSync('capacitor.config.json'))"
      - name: Check KS_PASS secret
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          if ! printf '%s' "$KS_PASS" | LC_ALL=C grep -Eq '^[A-Za-z0-9]{16,}$'; then
            echo "::error::KS_PASS must be 16+ characters, English letters and digits only, no spaces or symbols. Generate one with: openssl rand -hex 24"
            exit 1
          fi

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: deps-${{ hashFiles('package.json') }}
          restore-keys: deps-

      - name: Prepare signing key
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          if [ ! -f signing/release.jks.enc ]; then
            keytool -genkeypair -keystore release.jks -storetype PKCS12 \
              -alias nile -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KS_PASS" \
              -dname "CN=Capacitor Nile, O=Nile, C=SD"
            mkdir -p signing
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
              -pass env:KS_PASS -in release.jks -out signing/release.jks.enc
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add signing/release.jks.enc
            git commit -m "add encrypted signing key"
            git push origin HEAD:main
          else
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -pass env:KS_PASS -in signing/release.jks.enc -out release.jks
          fi

      - name: Install dependencies
        run: npm install
      - name: Add Android platform
        run: '[ -d android ] || npx cap add android'
      - name: Set API level 36 and auto version
        env:
          N: ${{ github.run_number }}
        run: |
          sed -i -E "s/(compileSdkVersion|targetSdkVersion)[[:space:]]*=[[:space:]]*[0-9]+/\1 = 36/" android/variables.gradle
          sed -i -E "s/(versionCode[[:space:]]*=?[[:space:]]*)[0-9]+/\1$N/" android/app/build.gradle
          sed -i -E 's/(versionName[[:space:]]*=?[[:space:]]*)"[^"]*"/\1"1.'$N'"/' android/app/build.gradle
          grep -E "targetSdkVersion[[:space:]]*=[[:space:]]*36" android/variables.gradle
          grep -E "versionCode[[:space:]]*=?[[:space:]]*$N" android/app/build.gradle
      - name: Generate icons
        if: ${{ hashFiles('assets/icon-only.png') != '' }}
        run: |
          npm i -D @capacitor/assets
          npx capacitor-assets generate --android
      - name: Sync web files
        run: npx cap sync android

      - name: Build release
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Sign APK and AAB
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          OUT=android/app/build/outputs
          $BT/zipalign -p 4 $OUT/apk/release/app-release-unsigned.apk aligned.apk
          $BT/apksigner sign --ks release.jks --ks-key-alias nile \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --out nile-release.apk aligned.apk
          $BT/apksigner verify nile-release.apk
          $BT/aapt2 dump badging nile-release.apk | grep -E "^package:|targetSdkVersion"
          $BT/aapt2 dump badging nile-release.apk | grep -q "targetSdkVersion:'36'"
          cp $OUT/bundle/release/app-release.aab nile-release.aab
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore release.jks -storepass "$KS_PASS" -keypass "$KS_PASS" \
            nile-release.aab nile
          rm -f release.jks aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: release-signed
          path: |
            nile-release.apk
            nile-release.aab

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nile-release.apk
            nile-release.aab
