name: Build Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate files
        run: |
          test -f www/index.html
          grep -q viewport www/index.html
          node -e "JSON.parse(require('fs').readFileSync('package.json'))"
          node -e "JSON.parse(require('fs').readFileSync('capacitor.config.json'))"

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: deps-${{ hashFiles('package.json') }}
          restore-keys: deps-
      - name: Install dependencies
        run: npm install
      - name: Add Android platform
        run: '[ -d android ] || npx cap add android'
      - name: Set version
        env:
          N: ${{ github.run_number }}
        run: |
          sed -i "s/versionCode 1/versionCode $N/" android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.'$N'"/' android/app/build.gradle
      - name: Generate icons
        if: ${{ hashFiles('assets/icon-only.png') != '' }}
        run: |
          npm i -D @capacitor/assets
          npx capacitor-assets generate --android
      - name: Sync web files
        run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
