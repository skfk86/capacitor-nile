    ad.priv=!!(i&&i.privacyOptionsRequirementStatus==='REQUIRED');
    ad.ok=!i||i.canRequestAds!==false;
    if(ad.ok)adPre();
    settings();
  }catch(e){}
}
function adsBanner(on){
  if(!BANNER_ENABLED)return;
  ad.want=on;
  ad.q=ad.q.then(async()=>{
    const A=adP();if(!A||!ad.ok||ad.on===ad.want)return;const w=ad.want;
    try{
      if(w)await A.showBanner({adId:ADS.banner,adSize:'ADAPTIVE_BANNER',position:'BOTTOM_CENTER',margin:Math.round($('#nav').offsetHeight),isTesting:ADS.test});
      else await A.removeBanner();
      ad.on=w;document.body.classList.toggle('adb',w);
    }catch(e){}
  });
}
async function adPre(){const A=adP();if(!A||!ad.ok)return;try{await A.prepareInterstitial({adId:ADS.inter,isTesting:ADS.test})}catch(e){}}
async function adsAfterLesson(){
  S.adn=(S.adn||0)+1;sv();
  const A=adP();
  if(!A||!ad.ok||done.length<3||S.adn<3||Date.now()-(S.lastAd||0)<18e4||cur>=L.length-1)return;
  await new Promise(r=>setTimeout(r,700));
  if(!$('#lv').classList.contains('on'))return;
  try{await A.showInterstitial();S.adn=0;S.lastAd=Date.now();sv()}catch(e){}
  adPre();
}
function stats(){
  const pc=Math.round(done.length/L.length*100),R=52,C=2*Math.PI*R;
  const days=[...Array(7)].map((_,k)=>{const o=6-k;return{n:S.act[day(o)]||0,l:new Date(Date.now()-o*864e5).toLocaleDateString('ar',{weekday:'short'})}});
  const mx=Math.max(1,...days.map(d=>d.n));
  const box=(i,v,l)=>`<div class="sb">${ic(i,20)}<b>${v}</b><span>${l}</span></div>`;
  $('#stats').innerHTML=`<div class="ring"><svg width="132" height="132" viewBox="0 0 132 132"><circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--line)" stroke-width="12"/><circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--sun)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pc/100)}" transform="rotate(-90 66 66)"/></svg><div><b>${pc}%</b><span>من الرحلة مكتملة</span><span class="rk">${ic('trophy',14)} ${rank()}</span></div></div><div class="sg">${box('check',done.length+'/'+L.length,'محطات مكتملة')}${box('clock',mins(),'دقيقة تعلّم')}${box('flame',streak(),'أيام متتالية')}${box('copy',S.copies,'أكواد منسوخة')}</div><h3 class="sh">نشاطك في آخر 7 أيام</h3><div class="wk">${days.map(d=>`<div><i${d.n?' class="on"':''} style="height:${Math.max(6,d.n/mx*70)}px"></i><span>${d.l}</span></div>`).join('')}</div>`;
}
const PA=['var(--nile)','#e0a21a','#2f9e6e','#d6604d','#8a6fd9','#3b8fd9'];
function paths(){
  $('#paths').innerHTML='<p class="pi">اختر مساراً يناسب هدفك وتنقّل بينها بحرية. تقدمك يُحفظ تلقائياً.</p>'+PT.map((p,k)=>{
    const n=p.l.filter(i=>done.includes(i)).length,f=n===p.l.length,r=20,C=2*Math.PI*r;
    return `<button class="pt" data-p="${k}" style="--a:${PA[k]}"><span class="pr"><span class="ti">${ic(p.i,24)}</span><span class="pb"><small>المسار ${k+1}</small><h3>${p.t}</h3><p>${p.s}</p></span><span class="rg"><svg width="52" height="52" viewBox="0 0 52 52"><circle cx="26" cy="26" r="${r}" fill="none" stroke="var(--line)" stroke-width="5"/><circle cx="26" cy="26" r="${r}" fill="none" stroke="var(--a)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-n/p.l.length)}" transform="rotate(-90 26 26)"/></svg><b>${Math.round(n/p.l.length*100)}%</b></span></span><span class="pf"><span class="dt">${p.l.map(i=>`<i${done.includes(i)?' class="on"':''}></i>`).join('')}</span><span class="go2">${f?'مراجعة':n?'تابع':'ابدأ'}${ic('next',16)}</span></span></button>`}).join('');
}
function settings(){
  const seg=(k,o,c)=>`<div class="seg">${o.map(x=>`<button data-${k}="${x[0]}"${String(c)===String(x[0])?' class="on"':''}>${x[1]}</button>`).join('')}</div>`;
  $('#sets').innerHTML=`<div class="row"><h3>المظهر</h3>${seg('th',[['auto','تلقائي'],['light','فاتح'],['dark','داكن']],S.theme)}</div><div class="row"><h3>حجم الخط في الدروس</h3>${seg('fz',[[0.9,'صغير'],[1,'متوسط'],[1.15,'كبير']],S.fz)}</div>${ad.priv?'<div class="row"><h3>الإعلانات والخصوصية</h3><p>غيّر اختيارك بشأن الإعلانات المخصصة.</p><button class="dz" id="adpriv" style="color:var(--nile)">'+ic('sliders',18)+' خيارات الخصوصية</button></div>':''}<div class="row"><h3>البيانات</h3><p>يحذف تقدّمك وإحصائياتك من هذا الجهاز.</p><button class="dz" id="reset">${ic('trash',18)} إعادة ضبط التقدّم</button></div><p class="ft">Capacitor Nile، الإصدار 1.0</p>`;
}
IC.next='<path d="m15 18-6-6 6-6"/>';
function render(){home();stats();paths();settings();const i=L.findIndex((_,k)=>!done.includes(k));$('#cta').innerHTML=(done.length===0?'ابدأ الرحلة':i<0?'استلم شهادتك':'تابع من المحطة '+(i+1))+ic('next',18)}
$('#cta').onclick=()=>{const i=L.findIndex((_,k)=>!done.includes(k));if(i<0)return pgCert();history.pushState({l:1},'');open(i)};
function tab(k){document.querySelectorAll('.tab').forEach((e,j)=>e.classList.toggle('on',j===k));document.querySelectorAll('#nav button').forEach((b,j)=>b.classList.toggle('on',j===k));scrollTo(0,0)}
const TB=[['book','الدروس'],['bars','الإحصائيات'],['route','المسارات'],['sliders','الإعدادات']];
$('#nav').innerHTML=TB.map((t,k)=>`<button data-t="${k}">${ic(t[0])}<span>${t[1]}</span></button>`).join('');
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b){tab(+b.dataset.t);refresh()}};
document.querySelectorAll('[data-menu]').forEach(b=>b.innerHTML=ic('menu'));
$('#paths').onclick=e=>{const b=e.target.closest('.pt');if(!b)return;const l=PT[+b.dataset.p].l;history.pushState({l:1},'');open(l.find(i=>!done.includes(i))??l[0]);};
$('#sets').onclick=e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='adpriv'){const A=adP();A&&A.showPrivacyOptionsForm().catch(()=>{});return}
  if(b.dataset.th){S.theme=b.dataset.th}
  else if(b.dataset.fz){S.fz=+b.dataset.fz}
  else if(b.id==='reset'){if(!confirm('حذف كل التقدّم والإحصائيات؟'))return;done=[];save();S.copies=0;S.act={};}
  sv();prefs();render();
};
const dr=$('#dr'),sc=$('#sc');
const drawer=o=>{dr.classList.toggle('on',o);sc.classList.toggle('on',o);adsBanner(!o)};
document.addEventListener('click',e=>{if(e.target.closest('[data-menu]'))drawer(true)});
sc.onclick=()=>drawer(false);
dr.innerHTML=`<div class="dh"><span class="sun2"></span><b dir="ltr">Capacitor Nile</b><span>تعلّم بناء تطبيقات Android</span></div>${[['about','info','عن التطبيق'],['apps','grid','المزيد من التطبيقات'],['ach','trophy','الإنجازات'],['cert','award','شهادة التخرج']].map(x=>`<button data-d="${x[0]}">${ic(x[1])}${x[2]}</button>`).join('')}`;
function sheet(t,h){const s=$('#sh');s.innerHTML=`<div class="bar"><button class="bk" aria-label="رجوع">${ic('back')}</button><span class="bt">${t}</span></div><div class="pg">${h}</div>`;s.scrollTop=0;history.pushState({s:1},'');s.classList.add('on');ovOn()}
$('#sh').onclick=e=>{if(e.target.closest('.bk'))history.back()};
function pgAbout(){sheet('عن التطبيق',`<div class="ab"><span class="sun2 big"></span><h2 dir="ltr">Capacitor Nile</h2><p>الإصدار 1.0</p></div><p>تطبيق تعليمي عربي يشرح خطوة بخطوة كيف تبني تطبيق Android كاملاً من هاتفك، من أول ملف HTML حتى نسخة موقّعة جاهزة للنشر.</p><ul><li>${L.length} محطة عملية بأكواد قابلة للنسخ.</li><li>ستة مسارات تتابع تقدمك فيها.</li><li>إحصائيات وإنجازات تحفزك على الاستمرار.</li></ul><p>مبني بـ HTML وCSS وJavaScript، ومغلّف بـ Capacitor.</p>`)}
function pgApps(){const card=a=>{const g=a.u?'a':'div';return `<${g} class="ap"${a.u?` href="${a.u}" target="_blank" rel="noopener"`:''}><span class="ti">${ic(a.i||'phone',24)}</span><span><b>${a.n}</b><small>${a.d}</small></span>${a.f?`<em class="cur${a.cur?' on':''}">${a.cur?'نشط':'قريباً'}</em>`:''}</${g}>`};sheet('المزيد من التطبيقات','<h3 class="sh" style="margin-top:4px">عائلة النيل</h3>'+APPS.filter(a=>a.f).map(card).join('')+'<h3 class="sh">تطبيقات أخرى</h3>'+APPS.filter(a=>!a.f).map(card).join(''))}
function pgAch(){const n=AC.filter(a=>a[3]()).length;sheet('الإنجازات',`<p class="ac0">${n} من ${AC.length} إنجازات مفتوحة</p><div class="ag">${AC.map(a=>{const u=a[3]();return `<div class="bd${u?' on':''}"><span>${ic(u?a[0]:'lock',26)}</span><b>${a[1]}</b><small>${a[2]}</small></div>`}).join('')}</div>`)}
dr.onclick=e=>{const b=e.target.closest('[data-d]');if(!b)return;drawer(false);({about:pgAbout,apps:pgApps,ach:pgAch,cert:pgCert})[b.dataset.d]()};
prefs();tab(0);render();setTimeout(adsInit,600);


</script>
</body>
</html>
